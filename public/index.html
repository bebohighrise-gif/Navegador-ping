<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0a0d11" />
  <title>Bebo AI · Consola</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="shell">
    <div class="titlebar">
      <button type="button" class="drawer-toggle" id="drawerToggle" aria-label="Mostrar proyectos y archivos">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 6h14M3 10h14M3 14h14"/></svg>
      </button>
      <div class="dots">
        <div class="dot r"></div>
        <div class="dot y"></div>
        <div class="dot g"></div>
      </div>
      <div class="title">Bebo AI — Consola Linux</div>
      <div class="conn-badge" id="conn"><span class="led"></span><span id="connText">conectando</span></div>
    </div>

    <div class="body">
      <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
      <aside class="sidebar" id="sidebar">
        <section class="panel projects">
          <div class="panel-head">
            <h2>Proyectos</h2>
            <button type="button" class="panel-refresh" id="refreshProjects" aria-label="Actualizar proyectos">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 10a6 6 0 0 1 10.2-4.2M16 10a6 6 0 0 1-10.2 4.2M14 3v3h-3M6 17v-3h3"/></svg>
            </button>
          </div>
          <div class="panel-body" id="projectsList">
            <div class="tree-empty">Cargando…</div>
          </div>
        </section>

        <section class="panel files">
          <div class="panel-head">
            <h2 id="filesTitle">Archivos</h2>
            <button type="button" class="panel-refresh" id="refreshFiles" aria-label="Actualizar archivos">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 10a6 6 0 0 1 10.2-4.2M16 10a6 6 0 0 1-10.2 4.2M14 3v3h-3M6 17v-3h3"/></svg>
            </button>
          </div>
          <div class="panel-body" id="filesTree">
            <div class="tree-empty">Elegí un proyecto arriba para ver sus archivos.</div>
          </div>
        </section>
      </aside>

      <div class="window-col">
        <div class="window">
          <div class="term-wrap"><div id="terminal"></div></div>
        </div>
        <div class="statusbar">
          <div class="seg"><span id="statusDot" class="err">●</span><span id="statusText">Iniciando…</span></div>
          <div class="sep"></div>
          <div class="seg grow"></div>
          <div class="seg label-long">bash</div>
          <div class="sep"></div>
          <div class="seg label-long">autosave activo</div>
        </div>
      </div>
    </div>
  </div>

  <div class="preview-overlay" id="previewOverlay"></div>
  <div class="preview-panel" id="previewPanel">
    <div class="preview-head">
      <span class="name" id="previewName">archivo</span>
      <button type="button" class="preview-close" id="previewClose" aria-label="Cerrar">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 5l10 10M15 5L5 15"/></svg>
      </button>
    </div>
    <div class="preview-body" id="previewBody"></div>
    <div class="preview-actions">
      <button type="button" id="previewCat">Abrir con cat en la terminal</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-web-links@0.9.0/lib/xterm-addon-web-links.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
