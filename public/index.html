<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Bebo AI · PC</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #0b0f14;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      color: #e6edf3;
    }

    /* Escritorio */
    .desktop {
      height: 100%;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(ellipse at 20% 20%, #122033 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, #1a1030 0%, transparent 45%),
        #0b0f14;
    }

    /* Barra superior tipo ventana */
    .titlebar {
      height: 42px;
      background: linear-gradient(180deg, #1c2330 0%, #141a24 100%);
      border-bottom: 1px solid #2a3344;
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 10px;
      user-select: none;
      flex-shrink: 0;
    }
    .dots { display: flex; gap: 7px; }
    .dot {
      width: 11px; height: 11px; border-radius: 50%;
    }
    .dot.r { background: #ff5f57; }
    .dot.y { background: #febc2e; }
    .dot.g { background: #28c840; }
    .title {
      flex: 1;
      text-align: center;
      font-size: 13px;
      color: #9aa7b8;
      letter-spacing: 0.3px;
    }
    .badge {
      font-size: 11px;
      background: #1e2a3a;
      color: #6ee7b7;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid #2d3b4f;
    }

    /* Ventana de terminal */
    .window {
      flex: 1;
      margin: 12px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #2a3344;
      box-shadow: 0 20px 50px rgba(0,0,0,0.45);
      display: flex;
      flex-direction: column;
      background: #0d1117;
    }
    .term-wrap {
      flex: 1;
      padding: 8px 10px 12px;
      overflow: hidden;
    }
    #terminal { height: 100%; width: 100%; }

    /* Estado */
    .status {
      height: 28px;
      background: #11161e;
      border-top: 1px solid #1e2633;
      display: flex;
      align-items: center;
      padding: 0 14px;
      font-size: 11px;
      color: #7d8a9a;
      gap: 12px;
      flex-shrink: 0;
    }
    .status .ok { color: #34d399; }
    .status .err { color: #f87171; }

    /* Móvil */
    @media (max-width: 600px) {
      .window { margin: 6px; border-radius: 8px; }
      .titlebar { height: 38px; }
    }
  </style>
</head>
<body>
  <div class="desktop">
    <div class="titlebar">
      <div class="dots">
        <div class="dot r"></div>
        <div class="dot y"></div>
        <div class="dot g"></div>
      </div>
      <div class="title">Bebo AI — Consola Linux</div>
      <div class="badge" id="conn">conectando…</div>
    </div>

    <div class="window">
      <div class="term-wrap">
        <div id="terminal"></div>
      </div>
      <div class="status">
        <span id="statusText">Iniciando shell…</span>
        <span style="margin-left:auto">Render · Alpine · bash</span>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-web-links@0.9.0/lib/xterm-addon-web-links.min.js"></script>
  <script>
    const term = new Terminal({
      cursorBlink: true,
      fontSize: 14,
      fontFamily: 'Menlo, Monaco, "Cascadia Code", "Courier New", monospace',
      theme: {
        background: '#0d1117',
        foreground: '#e6edf3',
        cursor: '#58a6ff',
        selectionBackground: '#264f78',
        black: '#484f58',
        red: '#ff7b72',
        green: '#3fb950',
        yellow: '#d29922',
        blue: '#58a6ff',
        magenta: '#bc8cff',
        cyan: '#39c5cf',
        white: '#b1bac4',
        brightBlack: '#6e7681',
        brightRed: '#ffa198',
        brightGreen: '#56d364',
        brightYellow: '#e3b341',
        brightBlue: '#79c0ff',
        brightMagenta: '#d2a8ff',
        brightCyan: '#56d4dd',
        brightWhite: '#f0f6fc',
      },
      allowProposedApi: true,
    });

    const fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);
    term.loadAddon(new WebLinksAddon.WebLinksAddon());
    term.open(document.getElementById('terminal'));
    fitAddon.fit();

    const connBadge = document.getElementById('conn');
    const statusText = document.getElementById('statusText');

    function connect() {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      const ws = new WebSocket(`${proto}://${location.host}/ws`);

      ws.onopen = () => {
        connBadge.textContent = 'en línea';
        connBadge.style.color = '#6ee7b7';
        statusText.innerHTML = '<span class="ok">●</span> Shell activa';
        const dims = { type: 'resize', cols: term.cols, rows: term.rows };
        ws.send(JSON.stringify(dims));
        term.focus();
      };

      ws.onmessage = (ev) => {
        term.write(ev.data);
      };

      ws.onclose = () => {
        connBadge.textContent = 'desconectado';
        connBadge.style.color = '#f87171';
        statusText.innerHTML = '<span class="err">●</span> Desconectado — reconectando…';
        setTimeout(connect, 2000);
      };

      ws.onerror = () => {
        statusText.innerHTML = '<span class="err">●</span> Error de conexión';
      };

      term.onData((data) => {
        if (ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'input', data }));
        }
      });

      window.addEventListener('resize', () => {
        fitAddon.fit();
        if (ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
        }
      });
    }

    connect();
  </script>
</body>
</html>
