services:
  - type: web
    name: bebo-safe-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: BEBO_API_KEY
        sync: false
      - key: BEBO_ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_D1_DATABASE_ID
        value: 642e3286-81b5-4821-90b3-7713b0e504f0
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: CORS_ORIGINS
        value: "*"
      - key: WORKSPACE_DIR
        value: /tmp/bebo-workspace
      - key: MAX_EXEC_SECONDS
        value: "20"
      - key: MAX_OUTPUT_BYTES
        value: "200000"
