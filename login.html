<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>NexHost — Acceso</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<!--CF_SCRIPT-->
<style>
/* ═══════════════════════════════════════════════
   NEXHOST v3 — LOGIN  ·  Precision Dark Edition
═══════════════════════════════════════════════ */
:root{
  --ink:#020209;
  --neon:#00f5a0; --neon2:#00c87a; --neon3:#003d27;
  --cyan:#00e0ff; --purple:#a855f7; --red:#ff3e5a;
  --amber:#ffbe2e; --blue:#4488ff;
  --txt:#e8e6f8; --txt2:#8888aa; --txt3:#2a2a44;
  --b1:rgba(255,255,255,.05);
  --font:'Space Grotesk',sans-serif;
  --mono:'Space Mono',monospace;
  --r:12px;
}
*{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent }
html,body{ height:100%; background:var(--ink); overflow:hidden }
body{ font-family:var(--font); -webkit-font-smoothing:antialiased; color:var(--txt) }

body::before{
  content:''; position:fixed; inset:0; z-index:9990; pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.015) 3px,rgba(0,0,0,.015) 4px);
}
body::after{
  content:''; position:fixed; inset:0; z-index:9991; pointer-events:none;
  background:radial-gradient(ellipse 85% 85% at 50% 50%,transparent 25%,rgba(2,2,9,.78) 100%);
}

#cv{ position:fixed; inset:0; z-index:0; pointer-events:none }
#cv-hex{ position:fixed; inset:0; z-index:1; pointer-events:none; opacity:0; transition:opacity 2.2s ease }
#cv-hex.on{ opacity:1 }

/* ── INTRO ── */
#intro{
  position:fixed; inset:0; z-index:600;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:clamp(24px,5vh,56px); background:var(--ink);
}
#intro.explode{ animation:introOut .65s cubic-bezier(.4,0,.2,1) forwards }
@keyframes introOut{ 0%{opacity:1;transform:scale(1)} 60%{opacity:.5;transform:scale(1.018)} 100%{opacity:0;transform:scale(1.04);pointer-events:none} }

/* ── Boot terminal ── */
#boot-box{ width:min(500px,88vw); opacity:0; transition:opacity .35s }
#boot-box.on{ opacity:1 }
#term{ background:rgba(4,4,16,.92); border:1px solid rgba(0,245,160,.08); border-radius:14px; overflow:hidden; box-shadow:0 32px 72px rgba(0,0,0,.9),0 0 0 1px rgba(0,245,160,.03) inset; backdrop-filter:blur(24px) }
#tbar{ background:rgba(0,0,0,.5); padding:10px 14px; display:flex; align-items:center; gap:7px; border-bottom:1px solid rgba(255,255,255,.04) }
.dot{ width:11px; height:11px; border-radius:50%; flex-shrink:0 }
.dot:nth-child(1){ background:#ff5f56 } .dot:nth-child(2){ background:#febc2e } .dot:nth-child(3){ background:#28c840 }
.t-ttl{ font-family:var(--mono); font-size:clamp(7px,2vw,9px); color:var(--txt3); margin-left:6px; letter-spacing:.05em }
#tbody{ padding:12px 16px 14px; min-height:100px; display:flex; flex-direction:column; gap:2px }
.tl{ display:flex; align-items:baseline; gap:8px; font-family:var(--mono); font-size:clamp(7px,2vw,9px); line-height:1.8; opacity:0; transform:translateX(-5px); transition:opacity .16s ease,transform .16s ease }
.tl.vis{ opacity:1; transform:none }
.tok{ color:var(--neon) } .tinfo{ color:var(--blue) } .twrn{ color:var(--amber) }
.cn{ color:var(--neon) } .cb{ color:var(--blue) } .ca{ color:var(--amber) }
.cw{ color:rgba(232,230,248,.85) } .cd{ color:var(--txt3) }
.bcur{ display:inline-block; width:6px; height:10px; background:var(--neon); margin-left:2px; animation:bc .72s step-end infinite; vertical-align:text-bottom }
@keyframes bc{ 0%,100%{opacity:1} 50%{opacity:0} }
#tfoot{ background:rgba(0,0,0,.35); padding:10px 16px; border-top:1px solid rgba(255,255,255,.03) }
#brow{ display:flex; align-items:center; gap:10px }
#btrack{ flex:1; height:2px; background:rgba(0,245,160,.06); border-radius:2px; overflow:hidden }
#bfill{ height:100%; width:0; border-radius:2px; background:linear-gradient(90deg,var(--neon3),var(--neon) 65%,rgba(255,255,255,.85)); box-shadow:0 0 10px rgba(0,245,160,.6); transition:width .12s linear }
#bpct{ font-family:var(--mono); font-size:8px; color:var(--neon); min-width:32px; text-align:right }
#bstat{ font-family:var(--mono); font-size:8px; color:var(--txt3); margin-top:5px; letter-spacing:.04em }

/* ── Name block ── */
#nameblock{ text-align:center; opacity:0 }
#nameblock.vis{ opacity:1 }
#bigname{ display:flex; align-items:baseline; justify-content:center; font-size:clamp(44px,13vw,108px); font-weight:700; letter-spacing:-.05em; line-height:1; font-family:var(--font) }
.nl{ display:inline-block; opacity:0; transform:translateY(-110vh) rotateX(-80deg); transform-origin:50% 100%; will-change:transform,opacity }
.nl.nex{ color:var(--txt) } .nl.host{ color:var(--neon) }
.nl.land{ opacity:1; transform:none; transition:opacity .06s,transform .54s cubic-bezier(.1,1.9,.28,1) }
.nl.bmp{ animation:lbmp .34s ease forwards }
@keyframes lbmp{ 0%{transform:scaleY(1) scaleX(1)} 28%{transform:scaleY(.5) scaleX(1.36) translateY(9px)} 58%{transform:scaleY(1.14) scaleX(.92) translateY(-5px)} 82%{transform:scaleY(.99) scaleX(1.01)} 100%{transform:scaleY(1) scaleX(1)} }
.nl.glow{ animation:lglow 1.1s ease forwards }
@keyframes lglow{ 0%{filter:brightness(1)} 18%{filter:brightness(3.2) drop-shadow(0 0 28px var(--neon)) drop-shadow(0 0 66px var(--neon))} 55%{filter:brightness(1.9) drop-shadow(0 0 12px var(--neon))} 100%{filter:brightness(1) drop-shadow(0 0 5px rgba(0,245,160,.32))} }
.nl.nex.glow{ animation:lgloww 1.1s ease forwards }
@keyframes lgloww{ 0%{filter:brightness(1)} 18%{filter:brightness(3.8) drop-shadow(0 0 20px #fff) drop-shadow(0 0 52px var(--neon))} 55%{filter:brightness(1.5) drop-shadow(0 0 9px rgba(255,255,255,.55))} 100%{filter:brightness(1) drop-shadow(0 0 4px rgba(255,255,255,.15))} }
#bigname.glitch{ animation:glt .4s steps(3) forwards }
@keyframes glt{ 0%{transform:none;filter:none} 12%{transform:translate(-4px,1px) skewX(-3deg);filter:drop-shadow(5px 0 0 var(--red)) drop-shadow(-5px 0 0 var(--cyan))} 28%{transform:translate(4px,-1px) skewX(2deg);filter:drop-shadow(-5px 0 0 var(--red)) drop-shadow(5px 0 0 var(--cyan))} 45%{transform:translate(-2px,0);filter:drop-shadow(2px 0 0 var(--purple))} 65%{transform:translate(2px,0);filter:drop-shadow(-2px 0 0 var(--neon))} 85%{transform:translate(-1px,0);filter:none} 100%{transform:none;filter:none} }
#uline{ height:1px; width:0; margin:12px auto 0; background:linear-gradient(90deg,transparent,var(--cyan) 20%,var(--neon) 50%,var(--cyan) 80%,transparent); box-shadow:0 0 22px rgba(0,245,160,.5),0 0 52px rgba(0,232,255,.15); transition:width 1.4s cubic-bezier(.4,0,.2,1) }
#uline.on{ width:min(380px,65vw) }
#tagline{ font-family:var(--mono); font-size:clamp(6px,1.8vw,9px); text-transform:uppercase; letter-spacing:clamp(.2em,.5vw,.42em); color:var(--txt3); margin-top:clamp(12px,3vw,20px); opacity:0; transform:translateY(7px); transition:opacity .9s,transform .9s }
#tagline.on{ opacity:1; transform:none }

/* ── FX ── */
.scan{ position:fixed; left:0; right:0; height:2px; z-index:9500; pointer-events:none; filter:blur(.4px) }
.scan.dn{ animation:scdn var(--d,.68s) cubic-bezier(.4,0,.6,1) forwards }
.scan.up{ animation:scup var(--d,.75s) cubic-bezier(.4,0,.6,1) forwards }
@keyframes scdn{ 0%{top:-2px;opacity:0} 6%{opacity:1} 88%{opacity:1} 100%{top:100vh;opacity:0} }
@keyframes scup{ 0%{top:100vh;opacity:0} 6%{opacity:1} 88%{opacity:1} 100%{top:-2px;opacity:0} }
.glyph{ position:fixed; pointer-events:none; z-index:9300; font-family:var(--mono); font-weight:700; animation:glfly .9s cubic-bezier(.15,.8,.28,1) forwards }
@keyframes glfly{ 0%{opacity:1;transform:translate(0,0) rotate(0deg) scale(1.2)} 100%{opacity:0;transform:translate(var(--tx),var(--ty)) rotate(var(--rot)) scale(.05)} }
.ring{ position:fixed; z-index:9400; border-radius:50%; pointer-events:none; width:var(--sz); height:var(--sz); top:50%; left:50%; transform:translate(-50%,-50%) scale(0); animation:ringexp var(--d,.9s) cubic-bezier(.2,.8,.3,1) forwards }
@keyframes ringexp{ 0%{transform:translate(-50%,-50%) scale(0);opacity:1} 100%{transform:translate(-50%,-50%) scale(1);opacity:0} }

/* ── HUD corners ── */
.hud{ position:fixed; z-index:200; pointer-events:none; opacity:0; transition:opacity .7s }
.hud.on{ opacity:1 }
@media(max-width:600px){ .hud{ display:none } }

/* ══════════════════════════════════
   CARD STAGE
══════════════════════════════════ */
#stage{ position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center; padding:20px; opacity:0; pointer-events:none }
#stage.on{ opacity:1; pointer-events:all }

.card{
  width:min(410px,100%); position:relative;
  background:linear-gradient(160deg,rgba(9,9,26,.98) 0%,rgba(4,4,14,.99) 100%);
  border:1px solid rgba(0,245,160,.12); border-radius:20px; overflow:hidden;
  backdrop-filter:blur(60px) saturate(160%);
  box-shadow:0 0 0 1px rgba(255,255,255,.04) inset,0 48px 120px rgba(0,0,0,.97),0 0 100px rgba(0,245,160,.03),0 0 0 1px rgba(0,245,160,.04);
  transform:scale(.9) translateY(50px); opacity:0;
}
#stage.on .card{ animation:cardIn .6s cubic-bezier(.2,1.4,.34,1) forwards }
@keyframes cardIn{ 0%{transform:scale(.92) translateY(38px);opacity:0} 52%{transform:scale(1.008) translateY(-3px);opacity:1} 76%{transform:scale(.999) translateY(2px)} 100%{transform:scale(1) translateY(0);opacity:1} }

/* Chromatic top edge */
.card::before{
  content:''; position:absolute; top:0; left:0; right:0; height:1px; z-index:20;
  background:linear-gradient(90deg,transparent 2%,rgba(0,232,255,.2) 12%,var(--neon) 30%,rgba(255,255,255,.9) 50%,var(--neon) 70%,rgba(0,232,255,.2) 88%,transparent 98%);
  box-shadow:0 0 28px rgba(0,245,160,.4),0 0 64px rgba(0,245,160,.08);
}
/* Ambient glow corner */
.card::after{ content:''; position:absolute; top:-60px; right:-60px; width:160px; height:160px; border-radius:50%; pointer-events:none; background:radial-gradient(circle,rgba(0,245,160,.06),transparent 70%) }

/* Shimmer */
.shimmer{ position:absolute; inset:0; pointer-events:none; z-index:1; background:linear-gradient(112deg,transparent 34%,rgba(255,255,255,.016) 50%,transparent 66%); background-size:200% 100%; animation:shm 7s ease-in-out infinite }
@keyframes shm{ 0%,100%{background-position:200%;opacity:0} 40%{opacity:1} 50%{background-position:-200%;opacity:1} 90%{opacity:0} }

/* Corner brackets */
.bk{ position:absolute; pointer-events:none; opacity:.18; transition:opacity .4s }
.bk::before,.bk::after{ content:''; position:absolute; background:var(--neon); border-radius:1px }
.bk-tl{top:12px;left:12px} .bk-tr{top:12px;right:12px} .bk-bl{bottom:12px;left:12px} .bk-br{bottom:12px;right:12px}
.bk-tl::before,.bk-tr::before,.bk-bl::before,.bk-br::before{ width:16px; height:1.5px; top:0 }
.bk-tl::after,.bk-bl::after{ left:0 } .bk-tr::after,.bk-br::after{ right:0 }
.bk-tl::after,.bk-tr::after,.bk-bl::after,.bk-br::after{ width:1.5px; height:16px }
.bk-tl::after,.bk-tr::after{ top:0 } .bk-bl::after,.bk-br::after{ bottom:0 }
.bk-tl::before{ left:0 } .bk-tr::before{ right:0 }
.bk-bl::before{ left:0;top:auto;bottom:0 } .bk-br::before{ right:0;top:auto;bottom:0 }
.card:hover .bk{ opacity:.5 }

/* ── Card header ── */
.ch{ padding:22px 26px 18px; border-bottom:1px solid rgba(255,255,255,.05); display:flex; align-items:center; gap:16px; background:linear-gradient(145deg,rgba(0,245,160,.025) 0%,transparent 60%); position:relative; z-index:2 }

/* Orb */
.ow{ position:relative; flex-shrink:0; width:44px; height:44px }
.orb{ width:100%; height:100%; border-radius:50%; background:conic-gradient(from 0deg,var(--neon3),var(--neon),var(--cyan),rgba(255,255,255,.75),var(--neon),var(--neon2),var(--neon3)); box-shadow:0 0 20px rgba(0,245,160,.52),0 0 48px rgba(0,245,160,.14),inset 0 1px 2px rgba(255,255,255,.28); animation:ospin 6s linear infinite }
@keyframes ospin{ to{transform:rotate(360deg)} }
.or1{ position:absolute; inset:-8px; border-radius:50%; border:1px solid rgba(0,245,160,.2); animation:or1p 3.4s ease-in-out infinite }
.or2{ position:absolute; inset:-16px; border-radius:50%; border:1px dashed rgba(0,245,160,.06); animation:or2p 12s linear infinite }
@keyframes or1p{ 0%,100%{transform:scale(1);opacity:.38} 50%{transform:scale(1.26);opacity:0} }
@keyframes or2p{ to{transform:rotate(360deg)} }

.brand{ flex:1; min-width:0 }
.bn-wrap{ font-size:clamp(18px,4.5vw,23px); font-weight:700; letter-spacing:-.03em; display:flex; align-items:baseline; gap:1px }
.bn{ color:var(--txt) } .bh{ color:var(--neon); text-shadow:0 0 20px rgba(0,245,160,.45) }
.bsub{ font-family:var(--mono); font-size:clamp(7px,1.6vw,8px); letter-spacing:.22em; text-transform:uppercase; color:var(--txt3); margin-top:4px }

/* Status pill */
.pill{ display:flex; align-items:center; gap:7px; flex-shrink:0; font-family:var(--mono); font-size:clamp(7px,1.5vw,8px); color:var(--txt2); background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.06); padding:5px 11px; border-radius:20px; white-space:nowrap; transition:border-color .5s,color .5s }
.pill.ok{ border-color:rgba(0,245,160,.2); color:var(--neon) }
.sdot{ width:6px; height:6px; border-radius:50%; background:var(--txt3); flex-shrink:0; transition:background .5s,box-shadow .5s; animation:sdp 2.4s ease-in-out infinite }
.pill.ok .sdot{ background:var(--neon); box-shadow:0 0 7px var(--neon) }
@keyframes sdp{ 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.15;transform:scale(.6)} }

/* ── Card body ── */
.cb{ padding:22px 26px 26px; position:relative; z-index:2 }

.slbl{ display:flex; align-items:center; gap:10px; margin-bottom:14px }
.slbl-txt{ font-family:var(--mono); font-size:8px; font-weight:700; text-transform:uppercase; letter-spacing:.28em; color:var(--txt3); white-space:nowrap }
.sline{ flex:1; height:1px; background:linear-gradient(90deg,rgba(0,245,160,.15),transparent) }

.flbl{ display:block; font-size:11px; font-weight:600; color:var(--txt2); letter-spacing:.04em; margin-bottom:8px }

/* Input */
.iw{ position:relative }
.inp{ width:100%; background:rgba(0,0,0,.48); border:1px solid rgba(255,255,255,.08); color:var(--txt); font-family:var(--mono); font-size:max(16px,clamp(13px,4vw,15px)); font-weight:400; padding:clamp(12px,3vw,15px) 50px clamp(12px,3vw,15px) clamp(14px,3.5vw,18px); border-radius:var(--r); outline:none; letter-spacing:.24em; transition:border-color .22s,box-shadow .22s,background .22s; caret-color:var(--neon) }
.inp::placeholder{ color:var(--txt3); letter-spacing:.28em; font-size:.9em }
.inp:focus{ border-color:rgba(0,245,160,.38); box-shadow:0 0 0 3px rgba(0,245,160,.06),0 0 30px rgba(0,245,160,.05); background:rgba(0,245,160,.012) }
.inp.shake{ animation:ishk .38s ease }
@keyframes ishk{ 0%,100%{transform:none} 18%{transform:translateX(-9px)} 36%{transform:translateX(9px)} 54%{transform:translateX(-6px)} 72%{transform:translateX(6px)} 88%{transform:translateX(-3px)} }
.inp.err{ border-color:rgba(255,62,90,.4)!important; box-shadow:0 0 0 3px rgba(255,62,90,.06)!important }

.eye{ position:absolute; right:12px; top:50%; transform:translateY(-50%); background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.07); border-radius:8px; cursor:pointer; width:32px; height:28px; display:flex; align-items:center; justify-content:center; color:var(--txt3); transition:all .18s }
.eye:hover{ color:var(--neon); background:rgba(0,245,160,.1); border-color:rgba(0,245,160,.28); box-shadow:0 0 12px rgba(0,245,160,.15) }
.eye:active{ transform:translateY(-50%) scale(.9) }
.eye svg{ width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; display:block }

.sbw{ height:2px; background:rgba(255,255,255,.04); border-radius:2px; margin-top:9px; overflow:hidden }
.sb{ height:100%; width:0; border-radius:2px; transition:width .35s cubic-bezier(.4,0,.2,1),background .35s,box-shadow .35s }

.caps{ display:none; align-items:center; gap:6px; margin-top:9px; font-family:var(--mono); font-size:9px; color:var(--amber); letter-spacing:.04em }
.caps.on{ display:flex }
.att{ font-family:var(--mono); font-size:9px; color:var(--txt3); text-align:right; margin-top:7px; display:none }
.att.on{ display:block }

/* Alerts */
.alrt{ margin-top:13px; padding:10px 14px; border-radius:10px; font-family:var(--mono); font-size:9px; display:none; align-items:center; gap:10px; animation:apop .18s cubic-bezier(.34,1.45,.64,1) }
@keyframes apop{ from{opacity:0;transform:translateY(-4px) scale(.97)} }
.alrt.on{ display:flex }
.a-e{ background:rgba(255,62,90,.06); border:1px solid rgba(255,62,90,.2); color:#ff7090 }
.a-i{ background:rgba(68,136,255,.06); border:1px solid rgba(68,136,255,.18); color:#80aaff }
.a-l{ background:rgba(255,190,46,.05); border:1px solid rgba(255,190,46,.2); color:var(--amber) }
.alrt svg{ width:13px; height:13px; flex-shrink:0; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round }

/* Button */
.btn{ position:relative; width:100%; margin-top:22px; padding:clamp(14px,3.5vw,16px) 24px; border:none; border-radius:var(--r); background:linear-gradient(135deg,var(--neon) 0%,var(--neon2) 48%,var(--cyan) 100%); color:#000; font-family:var(--font); font-size:clamp(12px,3.2vw,13px); font-weight:700; letter-spacing:.06em; cursor:pointer; overflow:hidden; transition:transform .15s,box-shadow .25s,opacity .2s; box-shadow:0 4px 32px rgba(0,245,160,.28); -webkit-appearance:none }
.btn::before{ content:''; position:absolute; inset:0; background:linear-gradient(135deg,rgba(255,255,255,.18) 0%,transparent 52%); opacity:0; transition:opacity .2s }
.btn::after{ content:''; position:absolute; top:0; left:-130%; width:55%; height:100%; background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent); transform:skewX(-18deg); transition:left .65s ease }
.btn:not(:disabled):hover{ transform:translateY(-2px); box-shadow:0 10px 48px rgba(0,245,160,.5),0 0 90px rgba(0,245,160,.08) }
.btn:not(:disabled):hover::before{ opacity:1 }
.btn:not(:disabled):hover::after{ left:145% }
.btn:not(:disabled):active{ transform:scale(.97) }
.btn:disabled{ opacity:.25; cursor:not-allowed }
.btn.ok{ background:linear-gradient(135deg,#3dffca,var(--neon),var(--cyan)); pointer-events:none; box-shadow:0 0 56px rgba(0,245,160,.58) }
.rpl{ position:absolute; border-radius:50%; background:rgba(0,0,0,.15); pointer-events:none; transform:scale(0); animation:rpla .55s ease forwards }
@keyframes rpla{ to{transform:scale(4.5);opacity:0} }
.spin{ display:none; width:14px; height:14px; border:2px solid rgba(0,0,0,.18); border-top-color:#000; border-radius:50%; animation:spn .42s linear infinite; vertical-align:middle; margin-right:9px }
@keyframes spn{ to{transform:rotate(360deg)} }

/* Footer */
.cf{ padding:12px 26px; border-top:1px solid rgba(255,255,255,.04); display:flex; align-items:center; justify-content:space-between; background:rgba(0,0,0,.22); position:relative; z-index:2; gap:10px }
.cfl{ font-family:var(--mono); font-size:clamp(7px,1.5vw,8px); color:var(--txt3); letter-spacing:.05em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex; align-items:center; gap:7px }
.cfl-dot{ width:5px; height:5px; border-radius:50%; background:var(--neon); box-shadow:0 0 6px var(--neon); flex-shrink:0; animation:sdp 2.4s ease-in-out infinite }
.cfr{ display:flex; align-items:center; gap:5px; flex-shrink:0 }
.chip{ font-family:var(--mono); font-size:clamp(6px,1.4vw,7px); letter-spacing:.1em; padding:3px 9px; border-radius:5px; font-weight:700 }
.chip-g{ background:rgba(0,245,160,.07); border:1px solid rgba(0,245,160,.16); color:var(--neon) }
.chip-b{ background:rgba(68,136,255,.07); border:1px solid rgba(68,136,255,.16); color:#80aaff }

/* ── Responsive ── */
@media(max-width:480px){
  html,body{ height:100%; overflow:hidden }
  #stage{ padding:14px; align-items:center }
  .card{ width:100%; border-radius:18px; max-height:calc(100svh - 28px); overflow-y:auto }
  .ch{ padding:16px 18px 14px; gap:13px } .ow{ width:38px; height:38px }
  .cb{ padding:16px 18px 20px } .cf{ padding:10px 18px }

<script>
(function(){
  const bg=document.getElementById('cv'),hx=document.getElementById('cv-hex');
  const bx=bg.getContext('2d'),gx=hx.getContext('2d');
  let W,H,t=0,fr=0;
  const rsz=()=>{W=bg.width=hx.width=innerWidth;H=bg.height=hx.height=innerHeight};
  rsz();addEventListener('resize',rsz);
  const stars=Array.from({length:130},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.2+.08,base:Math.random()*.14+.02,ph:Math.random()*Math.PI*2,sp:Math.random()*.006+.001,col:Math.random()>.8?[61,127,255]:Math.random()>.5?[0,245,160]:[168,85,247]}));
  const nodes=Array.from({length:22},()=>({x:Math.random(),y:Math.random(),vx:(Math.random()-.5)*.00012,vy:(Math.random()-.5)*.00012,r:Math.random()*1.5+.4,o:Math.random()*.06+.02}));
  const blobs=[{x:.22,y:.18,r:.55,h:155,s:.0005,a:.07},{x:.78,y:.72,r:.5,h:215,s:.00078,a:.065},{x:.5,y:.9,r:.44,h:142,s:.0006,a:.06},{x:.1,y:.55,r:.4,h:275,s:.00082,a:.05},{x:.9,y:.28,r:.38,h:193,s:.00072,a:.048}];
  const S=50,SQ3=Math.sqrt(3);let cells=[];
  function buildHex(){cells=[];const cw=SQ3*S,rh=S*1.5,cols=Math.ceil(W/cw)+2,rows=Math.ceil(H/rh)+2;for(let r=-1;r<rows;r++)for(let c=-1;c<cols;c++)cells.push({x:c*cw+(r%2===0?0:cw/2),y:r*rh,ph:Math.random()*Math.PI*2,sp:Math.random()*.0006+.0003})}
  buildHex();addEventListener('resize',()=>{rsz();buildHex()});
  (function draw(){
    t++;fr++;bx.clearRect(0,0,W,H);
    blobs.forEach(b=>{const ox=Math.sin(t*b.s*1.3)*.08,oy=Math.cos(t*b.s)*.07;const g=bx.createRadialGradient((b.x+ox)*W,(b.y+oy)*H,0,(b.x+ox)*W,(b.y+oy)*H,b.r*Math.min(W,H));g.addColorStop(0,`hsla(${b.h},100%,52%,${b.a})`);g.addColorStop(1,'transparent');bx.fillStyle=g;bx.fillRect(0,0,W,H)});
    stars.forEach(s=>{const a=s.base+Math.sin(fr*s.sp+s.ph)*s.base*.65;bx.beginPath();bx.arc(s.x*W,s.y*H,s.r,0,Math.PI*2);bx.fillStyle=`rgba(${s.col.join(',')},${a})`;bx.fill()});
    nodes.forEach(p=>{p.x=(p.x+p.vx+1)%1;p.y=(p.y+p.vy+1)%1;bx.beginPath();bx.arc(p.x*W,p.y*H,p.r,0,Math.PI*2);bx.fillStyle=`rgba(0,245,160,${p.o})`;bx.fill()});
    for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){const dx=(nodes[i].x-nodes[j].x)*W,dy=(nodes[i].y-nodes[j].y)*H,d=Math.sqrt(dx*dx+dy*dy);if(d<165){bx.beginPath();bx.moveTo(nodes[i].x*W,nodes[i].y*H);bx.lineTo(nodes[j].x*W,nodes[j].y*H);bx.strokeStyle=`rgba(0,245,160,${(1-d/165)*.042})`;bx.lineWidth=.55;bx.stroke()}}
    gx.clearRect(0,0,W,H);
    cells.forEach(cell=>{const p=Math.sin(t*cell.sp+cell.ph);const a=(.008+p*.006)*Math.max(0,Math.min(1,(Math.min(W,H)-60)/300));gx.strokeStyle=`rgba(0,245,160,${a})`;gx.lineWidth=.45;gx.beginPath();for(let i=0;i<6;i++){const ang=Math.PI/180*(60*i-30);const x=cell.x+(S-.5)*Math.cos(ang),y=cell.y+(S-.5)*Math.sin(ang);i===0?gx.moveTo(x,y):gx.lineTo(x,y)}gx.closePath();gx.stroke()});
    requestAnimationFrame(draw);
  })();
})();

function tickClock(){const n=new Date(),el=document.getElementById('hclock');if(el)el.textContent=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0')}

function runBoot(){

function animBar(fill,pct,from,to){let c=from;const s=()=>{c=Math.min(c+1,to);fill.style.width=c+'%';pct.textContent=c+'%';if(c<to)requestAnimationFrame(s)};requestAnimationFrame(s)}

const WORD='NexHost',SPLIT=3;let spans=[];

function dropLetters(){

}

function impactLetter(el,idx){
  const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.bottom;
  const GL=['·','◆','▸','•','▪','✦','∘','◇','▹','×'],CO=['#00f5a0','#3d7fff','#ffbe2e','#fff','#33ffcc','#00e8ff','#a855f7'];
  for(let k=0;k<6;k++)setTimeout(()=>{const g=document.createElement('div');g.className='glyph';const a=-Math.PI+Math.random()*Math.PI,d=38+Math.random()*84;g.style.cssText=[`left:${cx+(Math.random()-.5)*14}px`,`top:${cy}px`,`--tx:${(Math.cos(a)*d).toFixed(0)}px`,`--ty:${(-64-Math.random()*98).toFixed(0)}px`,`--rot:${((Math.random()-.5)*300).toFixed(0)}deg`,`font-size:${7+Math.random()*8}px`,`color:${CO[~~(Math.random()*CO.length)]}`].join(';');g.textContent=GL[~~(Math.random()*GL.length)];document.body.appendChild(g);setTimeout(()=>g.remove(),1050)},k*18);
  if(idx===WORD.length-1){[{sz:'min(70vw,620px)',col:'rgba(0,245,160,.7)',d:'.75s'},{sz:'min(90vw,820px)',col:'rgba(0,232,255,.38)',d:'.98s'},{sz:'min(108vw,1000px)',col:'rgba(168,85,247,.22)',d:'1.18s'}].forEach(ring=>{const el=document.createElement('div');el.className='ring';el.style.cssText=`border:1.5px solid ${ring.col};--sz:${ring.sz};--d:${ring.d}`;document.body.appendChild(el);setTimeout(()=>el.remove(),1400)})}
}

function illuminate(){
  const nm=document.getElementById('bigname');nm.classList.add('glitch');setTimeout(()=>nm.classList.remove('glitch'),460);
  [{bg:'linear-gradient(90deg,transparent,#00f5a0 28%,#fff 50%,#00f5a0 72%,transparent)',sh:'0 0 18px 5px rgba(0,245,160,.55)',d:'.68s',up:false},{bg:'linear-gradient(90deg,transparent,#00e8ff 28%,#fff 50%,#00e8ff 72%,transparent)',sh:'0 0 14px 3px rgba(0,232,255,.48)',d:'.82s',up:true},{bg:'linear-gradient(90deg,transparent,#a855f7 28%,#c4b5fd 50%,#a855f7 72%,transparent)',sh:'0 0 11px 2px rgba(168,85,247,.42)',d:'.97s',up:false}].forEach(s=>{const el=document.createElement('div');el.className='scan '+(s.up?'up':'dn');el.style.cssText=`background:${s.bg};box-shadow:${s.sh}`;el.style.setProperty('--d',s.d);document.body.appendChild(el);setTimeout(()=>el.remove(),1100)});
  document.getElementById('cv-hex').classList.add('on');
  ['hud-tl','hud-tr','hud-bl','hud-br'].forEach((id,i)=>{setTimeout(()=>{const h=document.getElementById(id);if(h)h.classList.add('on')},i*75)});
  spans.forEach((s,i)=>setTimeout(()=>s.classList.add('glow'),i*58));
  setTimeout(()=>document.getElementById('uline').classList.add('on'),100);
  setTimeout(()=>document.getElementById('tagline').classList.add('on'),480);
  setTimeout(()=>{
    const nr=document.getElementById('bigname').getBoundingClientRect(),cx=nr.left+nr.width/2,cy=nr.top+nr.height/2;
    const BIG=['</>','{}','//','>>','SSH','0x','[*]','AES','#!','nx','01','HEX'],CO=['#00f5a0','#3d7fff','#ffbe2e','#fff','#a855f7','#33ffcc','#00e8ff'];
    BIG.forEach((g,i)=>setTimeout(()=>{const el=document.createElement('div');el.className='glyph';const a=(i/BIG.length)*Math.PI*2,d=95+Math.random()*195;el.style.cssText=[`left:${cx+(Math.random()-.5)*46}px`,`top:${cy}px`,`--tx:${(Math.cos(a)*d).toFixed(0)}px`,`--ty:${(Math.sin(a)*d-46).toFixed(0)}px`,`--rot:${((Math.random()-.5)*380).toFixed(0)}deg`,`font-size:${11+Math.random()*16}px`,`color:${CO[~~(Math.random()*CO.length)]}`,'font-weight:700'].join(';');el.textContent=g;document.body.appendChild(el);setTimeout(()=>el.remove(),1600)},i*40));
  },60);
  setTimeout(()=>explodeIntoCard(),1200);
}

function explodeIntoCard(){
  document.getElementById('intro').classList.add('explode');
  setTimeout(()=>{
    document.getElementById('intro').style.display='none';
    document.getElementById('stage').classList.add('on');
    initTilt();
    setTimeout(()=>{
      const pill=document.getElementById('pill-status');if(pill)pill.classList.add('ok');
      if(window.innerWidth>600)document.getElementById('pwd').focus();
      const n=new Date();
      document.getElementById('cf-ts').textContent=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0')+' · Sesión cifrada';
    },600);
  },550);
}

function initTilt(){
  if(window.innerWidth<=600)return;
  const stage=document.getElementById('stage'),card=document.getElementById('card');
  stage.addEventListener('mousemove',e=>{const r=card.getBoundingClientRect(),dx=(e.clientX-(r.left+r.width/2))/r.width,dy=(e.clientY-(r.top+r.height/2))/r.height;card.style.transform=`perspective(950px) rotateX(${-dy*8}deg) rotateY(${dx*8}deg) scale(1.012)`;card.style.transition='transform .08s ease'});
  stage.addEventListener('mouseleave',()=>{card.style.transform='none';card.style.transition='transform .65s cubic-bezier(.34,1.2,.64,1)'});
}

let attempts=0,lockedUntil=0,eyeVis=false;
const MAX_ATT={{MAX_ATTEMPTS}};
function checkCaps(e){document.getElementById('caps').classList.toggle('on',!!(e.getModifierState&&e.getModifierState('CapsLock')))}
function toggleEye(){eyeVis=!eyeVis;const inp=document.getElementById('pwd');inp.type=eyeVis?'text':'password';document.getElementById('eye-o').style.display=eyeVis?'none':'block';document.getElementById('eye-c').style.display=eyeVis?'block':'none';inp.focus()}
function onInput(){const l=document.getElementById('pwd').value.length,b=document.getElementById('sb');b.style.width=Math.min(l*8,100)+'%';b.style.background=l<4?'var(--red)':l<8?'var(--amber)':'var(--neon)';b.style.boxShadow=l>0?(l<4?'0 0 8px rgba(255,51,87,.5)':l<8?'0 0 8px rgba(255,190,46,.5)':'0 0 10px rgba(0,245,160,.55)'):'none';document.getElementById('pwd').classList.remove('err');hideA()}
function onKey(e){if(e.key==='Enter')login(e);checkCaps(e)}
function hideA(){['ae','ai','al'].forEach(id=>document.getElementById(id).classList.remove('on'))}
function showA(id,key,msg){hideA();document.getElementById(key).textContent=msg;document.getElementById(id).classList.add('on')}
function isLocked(){if(Date.now()<lockedUntil){showA('al','msg-l','Bloqueado. Espera '+Math.ceil((lockedUntil-Date.now())/1000)+'s');return true}return false}

async function login(e){
  if(isLocked())return;
  const pwd=document.getElementById('pwd').value,btn=document.getElementById('btn'),spin=document.getElementById('spin'),txt=document.getElementById('btxt');
  if(!pwd){showA('ai','msg-i','Ingresa tu contraseña');document.getElementById('pwd').focus();return}
  if(e&&e.clientX){const rpl=document.createElement('span');rpl.className='rpl';const rect=btn.getBoundingClientRect(),sz=Math.max(rect.width,rect.height);rpl.style.cssText=`width:${sz}px;height:${sz}px;left:${e.clientX-rect.left-sz/2}px;top:${e.clientY-rect.top-sz/2}px`;btn.appendChild(rpl);setTimeout(()=>rpl.remove(),600)}
  btn.disabled=true;spin.style.display='inline-block';txt.textContent='Verificando...';hideA();
  let cfToken='';
  const cfKey='{{CF_KEY}}';
  if(cfKey){const tsEl=document.querySelector('.cf-turnstile-response')||document.querySelector('[name=cf-turnstile-response]');cfToken=tsEl?tsEl.value:'';}
  try{
    const res=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pwd,cf_token:cfToken})});
    if(res.ok){
      const data=await res.json();
      if(data.token)localStorage.setItem('nx_token',data.token);
      spin.style.display='none';txt.textContent='✓ Acceso concedido';btn.classList.add('ok');
      document.getElementById('sb').style.cssText='width:100%;background:var(--neon);box-shadow:0 0 16px rgba(0,245,160,.75)';
      attempts=0;setTimeout(()=>{window.location.href='/?t='+encodeURIComponent(data.token)},580);
    } else {
      attempts++;spin.style.display='none';btn.disabled=false;txt.textContent='Entrar →';
      document.getElementById('pwd').classList.add('err');
      if(attempts>=MAX_ATT){const w=Math.min(30+(attempts-MAX_ATT)*15,120);lockedUntil=Date.now()+w*1000;showA('al','msg-l','Demasiados intentos. Espera '+w+'s.');attempts=0}
      else{showA('ae','msg-e','Contraseña incorrecta');if(attempts>=2){const rem=MAX_ATT-attempts,a=document.getElementById('att');a.textContent=rem+' intento'+(rem!==1?'s':'')+' restante'+(rem!==1?'s':'');a.classList.add('on')}}
      const inp=document.getElementById('pwd');inp.classList.add('shake');inp.value='';setTimeout(()=>inp.classList.remove('shake'),420);inp.focus();
    }
  }catch(ex){spin.style.display='none';btn.disabled=false;txt.textContent='Entrar →';showA('ae','msg-e','Error de conexión')}
}

buildIntro();
setTimeout(runBoot,80);

// Mostrar bloqueo de IP si el servidor lo indica
(function(){const lm='{{LOCKED_MSG}}';if(lm)showA('al','msg-l',lm);})();
</script>
